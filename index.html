<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tvesha’s Math Word Problems ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-bubbles" aria-hidden="true"></div>

  <main class="app">
    <header class="header">
      <h1>Hi Tvesha! 🌟 Math Time</h1>
      <p class="tagline">Word problems for Grade 2 &amp; 3 — type your answer and have fun!</p>
    </header>

    <section class="score-panel" aria-live="polite">
      <div class="score-card">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="score-card">
        <span class="label">Solved</span>
        <span class="value" id="solved-count">0</span>
      </div>
      <div class="score-card">
        <span class="label">Level</span>
        <span class="value" id="level-label">2</span>
      </div>
      <div class="score-card streak">
        <span class="label">Streak 🔥</span>
        <span class="value" id="streak">0</span>
      </div>
    </section>

    <section class="problem-card" aria-labelledby="problem-heading">
      <h2 id="problem-heading" class="sr-only">Current problem</h2>

      <div class="problem-work-row">
        <div class="problem-question">
          <p class="problem-text" id="problem-text">Loading your first problem…</p>
        </div>
        <div class="scratch-pad" aria-label="Scribble area for your work">
          <span class="scratch-pad-label">Scribble your work ✏️</span>
          <div class="scratch-canvas-wrap">
            <canvas id="scratch-canvas" width="400" height="300"></canvas>
          </div>
          <button type="button" class="btn btn-scratch-clear" id="clear-scratch-btn">Clear pad</button>
        </div>
      </div>

      <div class="hint-box hidden" id="hint-box">
        <span class="hint-label">Hint 💡</span>
        <p id="hint-text"></p>
      </div>

      <div class="answer-box hidden" id="answer-reveal">
        <span class="answer-label">Answer</span>
        <p id="answer-text"></p>
      </div>

      <form class="answer-form" id="answer-form" autocomplete="off">
        <label for="answer-input">Your answer</label>
        <div class="input-row">
          <input
            type="text"
            id="answer-input"
            inputmode="numeric"
            placeholder="Type here &amp; press Enter"
            aria-describedby="feedback"
          />
          <button type="submit" class="btn btn-primary" id="submit-btn">Check ✓</button>
        </div>
      </form>

      <p class="feedback" id="feedback" role="status"></p>

      <div class="actions">
        <button type="button" class="btn btn-secondary" id="hint-btn">Hint 💡</button>
        <button type="button" class="btn btn-outline" id="show-answer-btn">Show me the answer</button>
      </div>
    </section>

    <footer class="footer">
      <p>Made for Tvesha · Pink, blue &amp; purple power! 💜</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
